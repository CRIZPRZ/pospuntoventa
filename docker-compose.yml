services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ventas-app
    volumes:
      - .:/var/www/ventas:cached
      - ventas-vendor:/var/www/ventas/vendor
      - ventas-node-modules:/var/www/ventas/node_modules
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ventas-network

  webserver:
    image: nginx:alpine
    container_name: ventas-webserver
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/ventas:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ventas-network

  mysql:
    image: mysql:8.0
    hostname: mysql
    ports:
      - "3307:3306"
    volumes:
      - ventas-mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: ventas
    networks:
      - ventas-network
    command: --default-authentication-plugin=mysql_native_password

  mailpit:
    image: axllent/mailpit
    container_name: ventas-mailpit
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - ventas-network

  redis:
    image: redis:alpine
    container_name: ventas-redis
    ports:
      - "6380:6379"
    networks:
      - ventas-network

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ventas-mediamtx
    ports:
      - "8888:8888"   # HLS  → browser
      - "8554:8554"   # RTSP interno
      - "9997:9997"   # API  → Laravel auto-config
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    networks:
      - ventas-network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ventas-worker
    command: php artisan queue:work redis
    volumes:
      - .:/var/www/ventas:cached
      - ventas-vendor:/var/www/ventas/vendor
      - ventas-node-modules:/var/www/ventas/node_modules
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - app
      - redis
    networks:
      - ventas-network

  whatsapp-baileys:
    build:
      context: ./whatsapp-baileys
      dockerfile: Dockerfile
    container_name: ventas-whatsapp-baileys
    restart: unless-stopped
    env_file:
      - ./whatsapp-baileys/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3025
      SESSIONS_DIR: /app/sessions
    volumes:
      - ./whatsapp-baileys/sessions:/app/sessions
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3025/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ventas-network

networks:
  ventas-network:

volumes:
  ventas-mysql-data:
  ventas-vendor:
  ventas-node-modules:
